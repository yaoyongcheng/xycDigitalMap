# GitHub Pages 自动部署
# 流程：push 到 main → 云端安装依赖 → 构建 → 发布 dist/ 到 Pages
# 站点地址：https://yaoyongcheng.github.io/xycDigitalMap/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 Actions 页面手动触发

# GITHUB_TOKEN 最小必要权限：读源码 / 写 Pages / OIDC 换取部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一次部署；新的 push 取消仍在进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # package.json 的 build 脚本为 vue-tsc --noEmit && vite build，
      # 类型检查不通过则构建失败、不会发布，属预期保护行为
      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
